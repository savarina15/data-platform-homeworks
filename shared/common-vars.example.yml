---
# === Hadoop ===
hadoop_version: "3.4.0"
hadoop_home: "/home/team/hadoop-3.4.0"
hadoop_conf_dir: "{{ hadoop_home }}/etc/hadoop"

# === Java ===
java_home: "/usr/lib/jvm/java-11-openjdk-amd64"

# === NameNode ===
namenode_host: "{{ groups['namenode'] | first }}"
namenode_bind_host: "0.0.0.0"
namenode_rpc_port: 9000
namenode_http_port: 9870

# === HDFS ===
dfs_replication: 3
hdfs_user: "team"
hdfs_group: "team"
hdfs_base_dir: "/home/team/hdfs"
hdfs_namenode_dir: "{{ hdfs_base_dir }}/namenode"
hdfs_datanode_dir: "{{ hdfs_base_dir }}/datanode"
hdfs_checkpoint_dir: "{{ hdfs_base_dir }}/namesecondary"
hadoop_log_dir: "{{ hdfs_base_dir }}/logs"
hadoop_pid_dir: "{{ hdfs_base_dir }}/run"
hdfs_ready_retries: 30
hdfs_ready_delay: 3
hadoop_environment:
  JAVA_HOME: "{{ java_home }}"
  HADOOP_HOME: "{{ hadoop_home }}"
  HADOOP_CONF_DIR: "{{ hadoop_conf_dir }}"
  HADOOP_LOG_DIR: "{{ hadoop_log_dir }}"
  HADOOP_PID_DIR: "{{ hadoop_pid_dir }}"
  HADOOP_IDENT_STRING: "{{ hdfs_user }}"
secondarynamenode_host: "{{ groups['secondarynamenode'] | first }}"
secondarynamenode_http_port: 9868

# === YARN: ResourceManager ===
resourcemanager_host: "team-37-nn"
resourcemanager_webapp_port: 8088

# === YARN: NodeManager ===
nodemanager_webapp_port: 8042

# === YARN: JobHistory ===
jobhistory_webapp_port: 19888

# === Hive ===
hive_version: "4.0.0-alpha-2"
hive_home: "/home/team/apache-hive-{{ hive_version }}-bin"
hive_conf_dir: "{{ hive_home }}/conf"
metastore_host: "team-37-en"
mysql_hive_password: "CHANGE_ME"

# === Spark ===
spark_version: "3.5.1"
spark_home: "/home/team/spark-{{ spark_version }}-bin-hadoop3"
